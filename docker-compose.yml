
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gadgeto-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://gadgeto:gadgeto@host.docker.internal:5432/gadgeto
      - SECRET_KEY=dev-secret-key-change-me
      - ENVIRONMENT=development
      - CORS_ORIGINS=["http://localhost:3000", "http://localhost:3001"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://backend:8000"
    container_name: gadgeto-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://backend:8000"
    container_name: gadgeto-admin
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_healthy
