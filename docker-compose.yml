version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gadgeto-db
    environment:
      POSTGRES_USER: gadgeto
      POSTGRES_PASSWORD: gadgeto
      POSTGRES_DB: gadgeto
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gadgeto"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gadgeto-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://gadgeto:gadgeto@db:5432/gadgeto
      - SECRET_KEY=dev-secret-key-change-me
      - ENVIRONMENT=development
      - CORS_ORIGINS=["http://localhost:3000"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./media:/app/media

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gadgeto-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000

volumes:
  pgdata:
