
services:
  # ── Redis (catalog automation broker/lock/state) ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gadgeto-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # ── Backend API (FastAPI / Uvicorn) ──────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gadgeto-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://gadgeto:gadgeto@host.docker.internal:5432/gadgeto
      - SECRET_KEY=dev-secret-key-change-me
      - ENVIRONMENT=development
      - CORS_ORIGINS=["http://localhost:3000", "http://localhost:3001"]
      - FRONTEND_URL=http://localhost:3000
      - MEDIA_DIR=/app/media
      - SUPPLIER_FEEDS_DIR=/data/feeds
      - SUPPLIER_ITLINK_USERNAME=${SUPPLIER_ITLINK_USERNAME:-}
      - SUPPLIER_ITLINK_PASSWORD=${SUPPLIER_ITLINK_PASSWORD:-}
      - SUPPLIER_ITLINK_PRICE_ID=${SUPPLIER_ITLINK_PRICE_ID:-}
      - SUPPLIER_ITLINK_CUSTOMER_ID=${SUPPLIER_ITLINK_CUSTOMER_ID:-}
      - SUPPLIER_DCLINK_LOGIN=${SUPPLIER_DCLINK_LOGIN:-}
      - SUPPLIER_DCLINK_PASSWORD=${SUPPLIER_DCLINK_PASSWORD:-}
      # Redis / Celery (catalog automation)
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CATALOG_SYNC_REDIS_URL=redis://redis:6379/0
      - CATALOG_SYNC_ENABLED=${CATALOG_SYNC_ENABLED:-true}
      - CATALOG_SYNC_INTERVAL_HOURS=${CATALOG_SYNC_INTERVAL_HOURS:-4}
      - CATALOG_SYNC_ANCHOR_HOUR=${CATALOG_SYNC_ANCHOR_HOUR:-2}
      # Brevo — set these in .env or via your deployment secrets
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-noreply@gadgeto.com.ua}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-Gadgeto}
    volumes:
      # Full backend source tree (development) — eliminates stale-file bugs from individual mounts
      - ./backend:/app
      # Migrations directory is at the repo root, not under backend/
      - ./migrations:/app/migrations
      # Persistent uploaded media storage (survives container recreation)
      - ./data/media:/app/media
      # Supplier feeds (configurable via SUPPLIER_FEEDS_HOST_DIR env)
      - ${SUPPLIER_FEEDS_HOST_DIR:-./data/feeds}:/data/feeds
      # Mounted entrypoint so we can override uvicorn args without rebuilding
      - ./backend/entrypoint.sh:/entrypoint.sh
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--max-time", "3", "http://localhost:8000/health"]
      interval: 10s
      timeout: 4s
      retries: 5
    depends_on:
      redis:
        condition: service_started

  # ── Celery Worker (catalog automation — import/export jobs) ─────────────────
  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gadgeto-celery-worker
    command:
      - /bin/sh
      - -c
      - |
        cd /app &&
        celery -A app.tasks worker
        --loglevel=info
        --concurrency=1
        --max-tasks-per-child=1
        --without-heartbeat
        --without-gossip
        --without-mingle
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://gadgeto:gadgeto@host.docker.internal:5432/gadgeto
      - SECRET_KEY=dev-secret-key-change-me
      - ENVIRONMENT=development
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CATALOG_SYNC_REDIS_URL=redis://redis:6379/0
      - CATALOG_SYNC_ENABLED=${CATALOG_SYNC_ENABLED:-true}
      - CATALOG_SYNC_INTERVAL_HOURS=${CATALOG_SYNC_INTERVAL_HOURS:-4}
      - CATALOG_SYNC_ANCHOR_HOUR=${CATALOG_SYNC_ANCHOR_HOUR:-2}
      - SUPPLIER_ITLINK_USERNAME=${SUPPLIER_ITLINK_USERNAME:-}
      - SUPPLIER_ITLINK_PASSWORD=${SUPPLIER_ITLINK_PASSWORD:-}
      - SUPPLIER_ITLINK_PRICE_ID=${SUPPLIER_ITLINK_PRICE_ID:-}
      - SUPPLIER_ITLINK_CUSTOMER_ID=${SUPPLIER_ITLINK_CUSTOMER_ID:-}
      - SUPPLIER_DCLINK_LOGIN=${SUPPLIER_DCLINK_LOGIN:-}
      - SUPPLIER_DCLINK_PASSWORD=${SUPPLIER_DCLINK_PASSWORD:-}
      - ROZETKA_API_URL=${ROZETKA_API_URL:-https://api-seller.rozetka.com.ua}
      - ROZETKA_SELLER_USERNAME=${ROZETKA_SELLER_USERNAME:-}
      - ROZETKA_SELLER_PASSWORD=${ROZETKA_SELLER_PASSWORD:-}
    extra_hosts:
      # DATABASE_URL points at the host-run PostgreSQL (same as backend)
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./migrations:/app/migrations
      - ./data/media:/app/media
      - ${SUPPLIER_FEEDS_HOST_DIR:-./data/feeds}:/data/feeds
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  # ── Celery Beat (catalog automation — periodic scheduler) ───────────────────
  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gadgeto-celery-beat
    command:
      - /bin/sh
      - -c
      - |
        cd /app &&
        celery -A app.tasks beat
        --loglevel=info
        --pidfile=/tmp/celery-beat.pid
        --scheduler celery.beat.PersistentScheduler
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://gadgeto:gadgeto@host.docker.internal:5432/gadgeto
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CATALOG_SYNC_REDIS_URL=redis://redis:6379/0
      - CATALOG_SYNC_ENABLED=${CATALOG_SYNC_ENABLED:-true}
      - CATALOG_SYNC_INTERVAL_HOURS=${CATALOG_SYNC_INTERVAL_HOURS:-4}
      - CATALOG_SYNC_ANCHOR_HOUR=${CATALOG_SYNC_ANCHOR_HOUR:-2}
    extra_hosts:
      # DATABASE_URL points at the host-run PostgreSQL (same as backend)
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./migrations:/app/migrations
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_API_URL: "http://backend:8000"
    container_name: gadgeto-frontend
    volumes:
      # Mount source code, keep node_modules and .next in named volumes
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_API_URL: "http://backend:8000"
    container_name: gadgeto-admin
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
      - admin_next:/app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_STORE_URL=http://localhost:3000
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  redis_data:
  frontend_node_modules:
  frontend_next:
  admin_node_modules:
  admin_next:
