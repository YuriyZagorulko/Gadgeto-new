# Development override for docker-compose.yml
# Enables hot reload for all services without docker compose build
#
# USAGE:
#   # First time / after dependency changes:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml build
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
#   # Normal start (no rebuild needed):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
#   # Stop:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml down
#
# Source code changes on the host are immediately reflected.

services:
  backend:
    # Override entrypoint/command to enable reload
    entrypoint: []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # Mount source code for hot reload
    volumes:
      - ./backend/app:/app/app
      - ./migrations:/app/migrations

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_API_URL: "http://backend:8000"
    # Mount source code, keep node_modules and .next in named volumes
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_API_URL: "http://backend:8000"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
      - admin_next:/app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  frontend_next:
  admin_node_modules:
  admin_next:
