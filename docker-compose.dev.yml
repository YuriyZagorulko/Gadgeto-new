# Development override for docker-compose.yml
# Enables hot reload for all services without docker compose build
#
# USAGE:
#   docker compose up -d
#   # Frontend and backend now work with hot reload out of the box
#
#   # Stop:
#   docker compose down
#
# Source code changes on the host are immediately reflected.

services:
  backend:
    # Override entrypoint/command to enable reload
    entrypoint: []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # Mount source code for hot reload
    volumes:
      - ./backend/app:/app/app
      - ./migrations:/app/migrations

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_API_URL: "http://backend:8000"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
      - admin_next:/app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_STORE_URL=http://localhost:3000
    depends_on:
      - backend

volumes:
  admin_node_modules:
  admin_next:
